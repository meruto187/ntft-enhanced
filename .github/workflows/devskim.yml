name: DevSkim

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "20 6 * * 1"

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/DevSkim-Action@v1
        with:
          directory-to-scan: ${{ github.workspace }}
          ignore-globs: "**/.git/**,**/bin/**,**/obj/**,**/artifacts/**"
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: devskim-results.sarif
          category: devskim
